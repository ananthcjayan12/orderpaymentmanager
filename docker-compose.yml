version: '3.8'

services:
  db:
    image: postgres:13
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: order_payment_db
      POSTGRES_USER: order_payment_user
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: order_payment_web
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8010:8000"
    depends_on:
      - db
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: "your-secret-key"
      # Database settings (ensure your Django settings respect these variables)
      DATABASE_ENGINE: "django.db.backends.postgresql"
      DATABASE_NAME: "order_payment_db"
      DATABASE_USER: "order_payment_user"
      DATABASE_PASSWORD: "secretpassword"
      DATABASE_HOST: "db"
      DATABASE_PORT: "5432"

volumes:
  postgres_data: 