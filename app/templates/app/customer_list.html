{% extends 'app/base.html' %}

{% block title %}Customers - Order Manager{% endblock %}

{% block main_content %}
<div class="container-fluid">
    <div class="card">
        <div class="card-header">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0">Customers</h5>
                <div class="d-flex gap-2">
                    <form class="d-flex" method="get">
                        <input type="search" name="search" class="form-control me-2" placeholder="Search customers..." value="{{ search_query }}">
                        <button type="submit" class="btn btn-outline-primary">
                            <i class="fas fa-search"></i>
                        </button>
                    </form>
                    <a href="{% url 'app:customer-create' %}" class="btn btn-primary">
                        <i class="fas fa-plus me-2"></i>Add Customer
                    </a>
                </div>
            </div>
        </div>
        <div class="card-body">
            {% include 'app/includes/customer_list.html' %}
        </div>
    </div>
</div>

<style>
/* Custom styles for better UI */
.avatar-sm {
    width: 35px;
    height: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.bg-primary-light {
    background-color: rgba(13, 110, 253, 0.1) !important;
}

.text-primary {
    color: #0d6efd !important;
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .btn-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    
    .btn-group .btn {
        border-radius: 0.25rem !important;
        width: 100%;
    }
}
</style>
{% endblock %}
